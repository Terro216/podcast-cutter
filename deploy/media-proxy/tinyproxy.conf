# Egress proxy for podcast-cutter's audio fetches. Runs on the dev box, whose
# address the podcast CDNs are happy to serve; the bot itself runs elsewhere.
#
# Reachable only over the loopback interface, and reached only through an SSH
# forward, so there is no port on any public interface and no password to
# manage. See ../README.md.

User tinyproxy
Group tinyproxy

Port 3128
# The container shares the host's network namespace, so this is the host's
# loopback: nothing outside this machine can open a connection here, and the
# only thing that does is sshd handing over a forwarded channel.
Listen 127.0.0.1
Allow 127.0.0.1

# Episodes are large and the bot's own download timeout is 600s; a proxy that
# gives up sooner would turn a slow host into a broken one.
Timeout 600

# Two ffmpeg jobs at a time, each opening a handful of connections, plus the
# occasional full-episode download. 50 is generous.
#
# StartServers / MinSpareServers / MaxSpareServers are deliberately absent:
# tinyproxy 1.11 dropped the preforking model and warns about them on every
# start.
MaxClients 50

# https:// audio arrives as CONNECT — which is how ffmpeg uses an http_proxy
# for a TLS source. Nothing else may be tunnelled: without this list CONNECT
# would reach any port anywhere, which is the one way a loopback-only proxy
# could still become somebody's relay.
ConnectPort 443
ConnectPort 80

# Do not announce the detour. The hosts this exists for refuse datacenter
# addresses and inspect requests for proxy signals; a Via header naming
# tinyproxy invites exactly the 403 we are routing around.
DisableViaHeader Yes

PidFile "/tmp/tinyproxy.pid"
LogLevel Warning
