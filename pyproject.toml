[tool.poetry]
name = "podcast-cutter"
version = "0.2.0"
description = "Telegram bot that cuts a chosen interval out of a podcast episode"
authors = ["Podcast Cutter <podcast_cutter@inbox.ru>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "podcast_cutter" }]

[tool.poetry.dependencies]
python = "^3.10"
# job-queue powers the conversation timeout; rate-limiter queues outgoing
# calls so bursts of users cannot trip Telegram's flood limits.
# 22.7+ is required for InlineKeyboardButton(style=...), the coloured-button
# support added in Bot API 9.4.
python-telegram-bot = { extras = [
    "job-queue",
    "rate-limiter",
], version = "^22.8" }
# Already pulled in by python-telegram-bot, declared here because we use it
# directly for the Podcast Index client and episode downloads.
httpx = ">=0.27,<1.0"
python-dotenv = "^1.0.1"
# DB-API-compatible bindings with statically linked SQLCipher.
sqlcipher3 = "^0.6.2"
# Speech recognition, for finding a moment by what was said rather than by
# timestamp. CTranslate2 underneath, CPU-only here: the production host has no
# GPU and no AVX2, where `base` measured at RTF 0.07 and `small` at 0.23.
# The model weights are *not* vendored — they land on the /data volume at first
# use, because baking ~150 MB into a layer means re-shipping it on every deploy.
faster-whisper = "^1.2"
# Russian morphology for the lexical index. Measured need: an episode about
# neural networks had «нейросетей» four times and «нейросети» never, so a
# literal-token index could not find its own subject. Optional at import, so a
# machine without it still runs — it just stops matching inflections.
pymorphy3 = "^2.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
ruff = "^0.4.4"
# The evaluation baskets, and nothing else. YAML because a basket is written
# and read by a person and its comments carry half its value — the note saying
# what the recogniser was heard to do with a query is what turns a red number
# into a diagnosis. Dev-only on purpose: the bot never loads one, so this stays
# out of the production image, and `evals.py` imports it lazily to match.
pyyaml = "^6.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:podcast_cutter.*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
# conftest holds the test fakes and is imported like a local module.
known-first-party = ["podcast_cutter", "conftest"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
