services:
  podcast-cutter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: podcast-cutter
    restart: unless-stopped
    volumes:
      # Without this, every `docker compose up --build` recreates the container
      # and takes the log history and the journal with it.
      - podcast-data:/data
      # Curated, replaceable gameplay loops live outside the database volume:
      # read-only in the bot, easy to inspect on the host, and deliberately
      # excluded from the encrypted database backup.
      - ${BRAINROT_SOURCE_DIR:-/srv/podcast-cutter/brainrot/loops}:/data/brainrot:ro
    # Only application settings belong in the bot; backup credentials stay
    # with the backup service. Unset optional keys retain application defaults.
    environment:
      - DATA_DIR=/data
      - ADMIN_IDS
      - ASR_BACKEND
      - ASR_ENABLED
      - ASR_JOB_RETENTION_HOURS
      - ASR_MODEL
      - ASR_THREADS
      - BOT_TOKEN
      - DATABASE_KEY
      - EMBED_MODEL_DIR
      - LEGAL_BASE_URL
      - LEGAL_CONTACT
      - LOG_RETENTION_DAYS
      - MAX_CONCURRENT_JOBS
      - MAX_CUT_SECONDS
      - MAX_SOURCE_SECONDS
      - MEDIA_PROXY
      - MEDIA_PROXY_MODE
      - MEDIA_PROXY_PROBE_URL
      - PODCAST_API_BASEURL
      - PODCAST_API_KEY
      - PODCAST_API_SECRET
      - PODCAST_BLOCKLIST
      - RATE_ASR_PER_DAY
      - RATE_CUTS_PER_HOUR
      - RATE_INPUT_PER_MINUTE
      - SPEECHKIT_API_KEY
      - SPEECHKIT_FOLDER_ID
      - TELEGRAM_PROXY
      - TERMS_VERSION
      - TZ
      - USER_DATA_RETENTION_DAYS
      - WORK_DIR
    # Check both the event loop and successful Telegram polling. A live loop
    # alone can hide a stuck getUpdates task. The heartbeat job also exits
    # after 180s without polling progress so unless-stopped can recover it.
    # start_period covers model loading on a cold start.
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    # Transcription is the only thing here that can take a machine. This host
    # is shared and dual-socket, and `--cpus`-style quotas let threads wander
    # between sockets and onto SMT siblings of cores already in use; pinning to
    # physical cores of one socket keeps the work local to one memory node and
    # leaves the rest of the machine alone. Adjust to the host: `lscpu -e` says
    # which CPUs are which, and these must be *physical* cores, not siblings.
    # Checked on big-one: 0-7 are cores 0-7 of socket 0 on node 0, and their
    # siblings are 16-23. Keep ASR_THREADS equal to the width of this set.
    cpuset: "0-7"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # The near end of the forward to the egress proxy. The bot reaches it as
  # `http://media-proxy:3128` — that string is the whole of MEDIA_PROXY, so
  # moving the far end to a different host is a change to TUNNEL_HOST and
  # nothing else. See deploy/README.md.
  #
  # Behind a profile, and nothing depends_on it, so this file deploys exactly
  # the bot it deployed before unless `COMPOSE_PROFILES=proxy` is set. That is
  # also the rollback: unset it, `docker compose up -d`, and the sidecar is
  # gone. If it is running but sick, the bot logs that and fetches audio
  # directly — which is what it did before the detour existed.
  media-proxy:
    profiles: ["proxy"]
    build:
      context: ./deploy/tunnel
    container_name: podcast-cutter-tunnel
    restart: unless-stopped
    environment:
      # Empty rather than `:?required`: compose interpolates this file whether
      # or not the profile is active, so a required variable here would break
      # `up` for a deployment that wants no proxy at all. The entrypoint
      # complains instead, where only this container can hear it.
      TUNNEL_HOST: ${TUNNEL_HOST:-}
      TUNNEL_PORT: ${TUNNEL_PORT:-44222}
      TUNNEL_USER: ${TUNNEL_USER:-me}
      # Where the proxy listens on the far host: its loopback, so the proxy
      # itself needs no exposed port.
      TUNNEL_REMOTE: ${TUNNEL_REMOTE:-127.0.0.1:3128}
      TUNNEL_LISTEN_PORT: ${TUNNEL_LISTEN_PORT:-3128}
    volumes:
      # Kept out of the repo and out of the image: a key baked into a layer is
      # a key you cannot rotate, and one inside the repo is one Mutagen copies
      # around. Read-only — the container has no business writing here.
      # An absolute path because compose does not expand `~`.
      - ${TUNNEL_KEYS_DIR:-/home/me/.podcast-cutter/tunnel}:/keys:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Offsite backup to Yandex Disk, the same restic+rclone shape as the cinemarr
  # and vaultwarden stacks. Behind a profile and depended on by nothing, so it
  # is inert unless run explicitly (`scripts/backup.sh`) or by the systemd
  # timers in deploy/systemd. SQLCipher's CLI needs a writable mount for SQLite
  # WAL locks even though the script only reads the source and writes its
  # export to staging. It never gets the Docker socket.
  backup:
    profiles: ["backup"]
    build:
      # Only the backup image's own code; the repo's databases and scratch
      # files must not even enter its build context.
      context: ./backup
      dockerfile: Dockerfile
    image: podcast-cutter-backup:restic-0.19.1-rclone-1.74.4
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - podcast-data:/sources/data:rw
      - ${BACKUP_STAGE:-/srv/podcast-cutter-backup}:/backup
      # rclone persists refreshed OAuth tokens, so this is read-write. Its own
      # copy — tying the offsite path to another stack's volume is exactly the
      # coupling the cinemarr notes warn against.
      - ${BACKUP_RCLONE_DIR:-/home/me/.podcast-cutter/rclone}:/config/rclone
      - .:/repo:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  podcast-data:
