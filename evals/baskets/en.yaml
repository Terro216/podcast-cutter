# English evaluation basket — see ROADMAP.md §5 and podcast_cutter/evals.py.
#
# The English side has one known problem waiting for a number: `unicode61`
# finds `protein` and does not connect it to `proteins`, and pymorphy3 is a
# Russian dictionary. FTS5 ships `porter`, but a tokenizer is per table, so
# fixing it costs another column or another table. §15 left it until the
# baskets could say how much it actually costs — which makes plural/singular
# pairs a deliberate part of this basket rather than an accident of drafting.
language: en

episodes:
  invisible-biomimicry:
    title: The Borrowed Nature of Biomimicry
    podcast: 99% Invisible
    # Heavily produced narrative: music beds, field tape, narration cut against
    # interview. The best case the recogniser will ever get, and therefore the
    # ceiling the other three are read against.
    episode_id: "58523106514"
    duration_s: 1904
    condition: studio
    audio_url: https://mgln.ai/e/2/dts.podtrac.com/redirect.mp3/stitcher.simplecastaudio.com/3bb687b0-04af-4257-90f1-39eef4e631b6/episodes/ef052af4-9036-4c68-9d01-5e54358b7fe5/audio/128/default.mp3?aid=rss_feed&awCollectionId=3bb687b0-04af-4257-90f1-39eef4e631b6&awEpisodeId=ef052af4-9036-4c68-9d01-5e54358b7fe5&feed=BqbsxVfO
