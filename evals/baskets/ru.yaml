# Filled in by the first green run and updated deliberately whenever a number
# moves. The runner asserts no regression against these, not an absolute
# quality bar — nobody knows in advance what hit@3 should be on these episodes,
# and a threshold invented before the first measurement is a guess in a
# requirement's clothes.
baseline:
  reference:
    hit@1: 0.611
    hit@3: 0.667
    false_hit_rate: 0.0
    median_error_s: 1.0
  asr:
    hit@1: 0.361
    hit@3: 0.361
    false_hit_rate: 0.0
    median_error_s: 1.6
  reference+e5:
    hit@1: 0.667
    hit@3: 0.694
    false_hit_rate: 0.0
    median_error_s: 1.0
  asr+e5:
    hit@1: 0.444
    hit@3: 0.444
    false_hit_rate: 0.0
    median_error_s: 1.4
