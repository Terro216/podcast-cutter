# Lint and the full test suite, on every push and PR.
#
# The suite needs a real ffmpeg: the integration tests cut real audio served
# from a local HTTP server, which is what makes them worth running. Everything
# model-shaped (speech recognition, embeddings) is faked in tests, so no
# weights are downloaded here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        # The SSRF lock (`-max_redirects 0` in audio.py) only exists in
        # ffmpeg >= 7.1; production runs 7.1.x, while Ubuntu 24.04's apt
        # ffmpeg is 6.1 and fails every remote probe with "Option not
        # found". Pin CI to the same 7.1 line via BtbN's static builds.
        run: |
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-linux64-gpl-7.1.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          sudo install /tmp/ffmpeg-n7.1-latest-linux64-gpl-7.1/bin/ffmpeg \
            /tmp/ffmpeg-n7.1-latest-linux64-gpl-7.1/bin/ffprobe /usr/local/bin/
          ffprobe -version | head -1

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check . --output-format github

      - name: Tests
        run: poetry run pytest -q
