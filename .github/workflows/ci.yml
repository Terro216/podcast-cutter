# Lint and the full test suite, on every push and PR.
#
# The suite needs a real ffmpeg: the integration tests cut real audio served
# from a local HTTP server, which is what makes them worth running. Everything
# model-shaped (speech recognition, embeddings) is faked in tests, so no
# weights are downloaded here.

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks must see the history, not only the synthetic checkout tip.
          fetch-depth: 0

      - name: Secret scan (full history)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
            git --redact=100 --no-banner /repo

      - name: Install ffmpeg
        # The SSRF lock (`-max_redirects 0` in audio.py) requires ffmpeg >= 7.1;
        # Ubuntu 24.04 provides 6.1. BtbN no longer retains the previous 7.1
        # autobuild, so pin its available 8.1 release and published SHA256.
        # The production image is independent of this CI test-tool version.
        run: |
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-01-13-06/ffmpeg-n8.1.3-14-g330caae0c1-linux64-gpl-8.1.tar.xz
          echo "89cca03b81002bef5a48c2e983afa6100e52904052c1c75dfd2090b09b57efee  /tmp/ffmpeg.tar.xz" \
            | sha256sum --check --strict
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          sudo install /tmp/ffmpeg-n8.1.3-14-g330caae0c1-linux64-gpl-8.1/bin/ffmpeg \
            /tmp/ffmpeg-n8.1.3-14-g330caae0c1-linux64-gpl-8.1/bin/ffprobe /usr/local/bin/
          ffprobe -version | head -1

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check . --output-format github

      - name: Tests
        run: poetry run pytest -q
