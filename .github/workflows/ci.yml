# Lint and the full test suite, on every push and PR.
#
# The suite needs a real ffmpeg: the integration tests cut real audio served
# from a local HTTP server, which is what makes them worth running. Everything
# model-shaped (speech recognition, embeddings) is faked in tests, so no
# weights are downloaded here.

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks must see the history, not only the synthetic checkout tip.
          fetch-depth: 0

      - name: Secret scan (full history)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
            git --redact=100 --no-banner /repo

      - name: Install ffmpeg
        # The SSRF lock (`-max_redirects 0` in audio.py) only exists in
        # ffmpeg >= 7.1; production runs 7.1.x, while Ubuntu 24.04's apt
        # ffmpeg is 6.1 and fails every remote probe with "Option not
        # found". Pin CI to the same 7.1 line via BtbN's static builds. Use
        # an immutable release asset: the moving `latest` release no longer
        # carries 7.1 builds.
        run: |
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-16-13-00/ffmpeg-n7.1.5-16-g9a4bb2c579-linux64-gpl-7.1.tar.xz
          echo "21a55e0ad14423572523c04425fd2f7a03bee0436d25a36e629362b99e45fb00  /tmp/ffmpeg.tar.xz" \
            | sha256sum --check --strict
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          sudo install /tmp/ffmpeg-n7.1.5-16-g9a4bb2c579-linux64-gpl-7.1/bin/ffmpeg \
            /tmp/ffmpeg-n7.1.5-16-g9a4bb2c579-linux64-gpl-7.1/bin/ffprobe /usr/local/bin/
          ffprobe -version | head -1

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check . --output-format github

      - name: Tests
        run: poetry run pytest -q
